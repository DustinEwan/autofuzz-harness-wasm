name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The plugin's own tests, which prove `afz-protocol` resolves as a git dependency, plus the
  # probe module the README's scan example builds: it stays real by being compiled here.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Tests
        run: cargo test

      - name: Build the probe module
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path test-targets/wasm-probe/Cargo.toml

  # The conformance gate, run through the product command rather than a bespoke harness:
  # `afz install-harness` builds the plugin, the emitter, and the check binary, drives the
  # suite, and prints the report. No wasm toolchain is needed here: the emitter synthesizes
  # its module with `wasm-encoder`.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install afz
        run: cargo install --git https://github.com/DustinEwan/autofuzz.git afz-cli --locked

      - name: Validate
        run: afz install-harness "$GITHUB_WORKSPACE" --json > report.json

      # The plugin built in this checkout, with the manifest's own build command. The runner
      # spawns `target/release/afz-wasm` for the wire rules before it starts the suite, so the
      # binary has to exist by then, and `afz install-harness` above builds its own clone of this
      # repository rather than this working tree. The plugin is a native binary that loads modules
      # at runtime, so this needs no wasm target.
      - name: Build
        run: cargo build --release

      # The mechanism's own conformance check: prpc-core spawns this plugin and runs the six wire
      # rules (spawn, protocol-version, handshake-schema, unknown-method, framing-intact,
      # process-alive), then runs the profile's suite program - `afz validate-harness` - and
      # prints the profile's rules after the wire rules. The profile spec and the schemas it names
      # come from a shallow clone of the engine rather than a copy in this repository, because a
      # copy would drift from the engine this plugin is validated against. The runner runs from
      # this workspace because the suite program resolves the manifest's relative paths, and the
      # emitter, beside the directory it was started in. It exits non-zero on any violation or
      # suite error, so a broken wire contract fails this job.
      - name: Wire conformance
        run: |
          cargo install plugin-rpc --bin prpc-core --version 0.1.0-alpha.11 --locked
          git clone --depth 1 https://github.com/DustinEwan/autofuzz.git "$RUNNER_TEMP/afz-engine"
          prpc-core "$RUNNER_TEMP/afz-engine/afz-1.profile.json" ./afz-harness.json --suite

      # The goldens this repository publishes: zero violations, the five properties a bare
      # module realizes, seven justified absences, and the check binary agreeing on four of the
      # seven fixture-shaped ids. A deleted or gutted validator fails the second assertion.
      - name: Assert the report
        run: |
          jq -e '((.violations | length) == 0)
                 and ((.template.properties | map(select(.verdict == "pass") | .id) | sort) == ["coverage-digest-live","crash-unguarded","opaque-return","unconstructible-receiver","unrepresentable-symbol"])
                 and ((.template.properties | map(select(.verdict == "not-applicable")) | length) == 7)' report.json
          jq -e '((.validator.properties | map(select(.verdict == "pass")) | length) == 4)
                 and ((.validator.properties | map(select(.verdict == "not-applicable") | .id) | sort) == ["guard-refusal","method-receiver","private-symbol"])' report.json
